shell = "bash -c '{}'"
default-scheme = "base16-gruvbox-dark-medium"

[[items]]
name = "foot"
path = "https://github.com/tinted-theming/tinted-terminal"
themes-dir = "themes/foot"
supported-systems = ["base16", "base24"]
hook = "$HOME/.local/bin/theme-hook foot"

[[items]]
name = "tmux"
path = "https://github.com/tinted-theming/tinted-tmux"
themes-dir = "colors"
supported-systems = ["base16", "base24"]
hook = "$HOME/.local/bin/theme-hook tmux"

[[items]]
name = "zed"
path = "https://github.com/tinted-theming/tinted-zed"
themes-dir = "themes"
supported-systems = ["base16", "base24"]
hook = "$HOME/.local/bin/theme-hook zed"

[[items]]
name = "rofi"
path = "~/.config/tinted-theming/templates/desktop"
themes-dir = "build/rofi"
supported-systems = ["base16", "base24"]

